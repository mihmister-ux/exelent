name: Deploy to GitHub Pages

# Запускается только вручную или пушем в main — но не при первом же пуше,
# чтобы случайно не опубликовать недоделанное. Требует включённого
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, без которых деплой на Pages не пройдёт.
permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз. Не отменяем уже начатую: прерванный деплой
# оставляет Pages в состоянии «посредине».
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:c

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
